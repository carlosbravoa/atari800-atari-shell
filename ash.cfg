# ASH memory map.
#   $0700-$08FF  resident kernel (SIO byte streams + XEX executor), copied
#                down from MAIN at startup; KBUF sector buffer $0900-$09FF
#   $2000-$3FFF  the shell (entry = $2000, warm entry = $2003)
#   $4000-$4FFF  shell buffers (BSS)
# The kernel is the only part that survives a launch, so its 512-byte cap is
# a hard limit (link error on overflow).
MEMORY {
    ZP:   start = $0080, size = $0040, type = rw;
    HDR:  file = %O, start = $0000, size = $0006;
    MAIN: file = %O, start = $2000, size = $2000, define = yes;
    KRUN: start = $0700, size = $0200;
    RAM:  start = $4000, size = $1000;
    TRL:  file = %O, start = $0000, size = $0006;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    XEXHDR:   load = HDR,  type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    KERNEL:   load = MAIN, run = KRUN, type = rw, define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    XEXTRL:   load = TRL,  type = ro;
}
