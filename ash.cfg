# ASH memory map.
#   $0700-$1CFF  resident kernel: SIO, file stream + XEX executor, and the
#                D: file manager, then its buffers (KBSS). Copied down from
#                MAIN at startup. Capped below DOS 2.5's MEMLO ($1CFC), so
#                any .xex that loads under DOS loads under ASH (link error
#                on overflow).
#   $2000-$59FF  the shell (+ the kernel image before it is copied down) (entry = $2000, warm entry = $2003)
#   $5A00-$69FF  shell buffers (BSS); `basic` gets MEMLO $6A00;
#   $6A00-$A9FF  the editor's text buffer (only while editing)
MEMORY {
    ZP:   start = $0080, size = $0040, type = rw;
    HDR:  file = %O, start = $0000, size = $0006;
    MAIN: file = %O, start = $2000, size = $3A00, define = yes;
    KRUN: start = $0700, size = $15FC;
    RAM:  start = $5A00, size = $1000;
    TRL:  file = %O, start = $0000, size = $0006;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    XEXHDR:   load = HDR,  type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    KERNEL:   load = MAIN, run = KRUN, type = rw, define = yes;
    KBSS:     load = KRUN, type = bss, align = $100, define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    XEXTRL:   load = TRL,  type = ro;
}
